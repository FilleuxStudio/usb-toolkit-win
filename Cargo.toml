[package]
name = "usb-toolkit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
keywords = ["usb", "windows", "format", "diskpart"]
categories = ["command-line-utilities"]
description = "Outil Windows de gestion de clés USB (déblocage, formatage, renommage, fichiers cachés, icône, infos détaillées)"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "=0.1.19"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
